[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "auralis"
version = "0.4.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "librosa>=0.10",
    "soundfile>=0.12",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "jupyter>=1.0", "pesq>=0.0.4", "pystoi>=0.4"]
# N-speaker research track: pretrained SepFormer/ReSepFormer backbones and
# LibriMix/WSJ0-mix recipes. On Blackwell GPUs (RTX 50xx, sm_120) torch must be
# installed separately from the cu128 nightly index — stable wheels lack sm_120.
separation = [
    "speechbrain>=1.1",
    "torch>=2.1",
    "torchaudio>=2.1",
    # Simulated RIRs give the G1 benchmark an exact RT60 per condition, which a
    # recorded corpus cannot, and spare anyone rerunning it a 4 GB download.
    "pyroomacoustics>=0.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pyrefly]
python_interpreter = ".venv/bin/python"
search_path = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
